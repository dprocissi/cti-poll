<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4E2A84">
  <title>CTI · Audience Results</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">

  <style>
    :root {
      --nu-purple: #4E2A84;
      --nu-purple-deep: #3D1B6E;
      --nu-purple-mid: #544586;
      --nu-purple-light: #8B6BB1;
      --nu-purple-pale: #EDE9F5;
      --nu-gold: #FBAE40;
      --nu-gold-light: #FFD580;
      --nu-white: #FFFFFF;
      --nu-gray: #555759;
      --nu-gray-light: #A0A0A5;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #5a3094 0%, #2a1255 100%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--nu-white);
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* ===== ANIMATED BACKGROUND PARTICLES ===== */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251,174,64,0.3) 0%, transparent 70%);
      animation: float 25s infinite ease-in-out;
    }
    .particle:nth-child(1) { width: 200px; height: 200px; top: -100px; left: 10%; animation-delay: 0s; }
    .particle:nth-child(2) { width: 300px; height: 300px; top: 30%; right: -150px; animation-delay: -8s; }
    .particle:nth-child(3) { width: 250px; height: 250px; bottom: -125px; left: 30%; animation-delay: -16s; }
    .particle:nth-child(4) { width: 180px; height: 180px; top: 60%; left: 50%; animation-delay: -4s; background: radial-gradient(circle, rgba(139,107,177,0.2) 0%, transparent 70%); }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.1); }
      66% { transform: translate(-30px, 40px) scale(0.95); }
    }

    /* ===== LAYOUT ===== */
    .shell {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 28px;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-mark {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, var(--nu-gold), #ff9020);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: var(--nu-purple-deep);
      box-shadow: 0 8px 24px rgba(251,174,64,0.3);
    }
    .brand-text .brand-label {
      font-size: 11px;
      letter-spacing: 2.5px;
      color: var(--nu-gold);
      font-weight: 700;
      text-transform: uppercase;
    }
    .brand-text .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-top: 2px;
    }

    .header-stats {
      display: flex;
      gap: 12px;
    }
    .stat-pod {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      padding: 12px 22px;
      border-radius: 14px;
      text-align: center;
      min-width: 110px;
    }
    .stat-pod .stat-num {
      font-size: 32px;
      font-weight: 800;
      color: var(--nu-gold);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-pod .stat-lbl {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.65);
      margin-top: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* ===== HERO COMMENTARY ===== */
    .commentary-hero {
      background: linear-gradient(135deg, rgba(251,174,64,0.12) 0%, rgba(139,107,177,0.08) 100%);
      border: 1px solid rgba(251,174,64,0.3);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .commentary-hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--nu-gold), transparent);
    }
    .commentary-hero .commentary-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--nu-gold);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .commentary-hero .commentary-label::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--nu-gold);
      animation: pulse-dot 2s infinite;
      box-shadow: 0 0 12px var(--nu-gold);
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .commentary-text {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: -0.3px;
      color: rgba(255,255,255,0.95);
    }
    .commentary-text .highlight {
      color: var(--nu-gold);
      font-weight: 700;
      background: linear-gradient(transparent 60%, rgba(251,174,64,0.2) 60%);
      padding: 0 4px;
    }
    .commentary-followup {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      font-style: italic;
      line-height: 1.6;
    }

    /* ===== DASHBOARD GRID ===== */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 24px;
      position: relative;
    }
    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 24px;
      width: 60px; height: 3px;
      border-radius: 0 0 3px 3px;
    }
    .panel.q1::before { background: var(--nu-gold); }
    .panel.q2::before { background: var(--nu-purple-light); }

    .panel-title {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--nu-gold);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .panel.q2 .panel-title { color: var(--nu-purple-light); }
    .panel-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 20px;
      font-style: italic;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 38px 1fr 95px;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }
    .bar-letter {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--nu-purple-mid);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.3s;
    }
    .bar-row.multi .bar-letter {
      border-radius: 7px;
      width: 30px;
      height: 30px;
      font-size: 13px;
    }
    .bar-row.top-pick .bar-letter {
      background: var(--nu-gold);
      color: var(--nu-purple-deep);
      box-shadow: 0 0 14px rgba(251,174,64,0.5);
    }
    .bar-track {
      position: relative;
      height: 34px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      overflow: hidden;
    }
    .bar-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, var(--nu-purple-light), var(--nu-gold));
      border-radius: 8px;
      transition: width 1.2s cubic-bezier(0.4, 0.0, 0.2, 1);
      box-shadow: 0 0 12px rgba(251,174,64,0.2);
    }
    .bar-row.top-pick .bar-fill {
      background: linear-gradient(90deg, var(--nu-gold), #ff9020);
      box-shadow: 0 0 20px rgba(251,174,64,0.4);
    }
    .bar-label {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      font-weight: 600;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      z-index: 2;
      white-space: nowrap;
      max-width: calc(100% - 24px);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-stats {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .bar-stats .count {
      font-size: 18px;
      font-weight: 800;
      color: var(--nu-gold);
      line-height: 1;
    }
    .bar-stats .pct {
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      display: block;
      margin-top: 2px;
      font-weight: 500;
    }

    /* ===== INSIGHTS GRID (key observations) ===== */
    .insights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .insight-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }
    .insight-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--nu-gold), transparent);
    }
    .insight-label {
      font-size: 10px;
      letter-spacing: 1.8px;
      color: var(--nu-gold);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .insight-text {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255,255,255,0.88);
    }
    .insight-text strong { color: var(--nu-gold); font-weight: 700; }

    /* ===== EXPANDED ANALYSIS SECTIONS ===== */
    .section-divider {
      margin: 32px 0 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-divider::before, .section-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(251,174,64,0.4), transparent);
    }
    .section-divider .label {
      font-size: 11px;
      letter-spacing: 2.5px;
      color: var(--nu-gold);
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .analysis-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .analysis-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 22px 26px;
      position: relative;
      overflow: hidden;
      border-left: 3px solid var(--nu-gold);
    }
    .analysis-card.cat-trust       { border-left-color: #f59e0b; }
    .analysis-card.cat-institutional { border-left-color: #8B6BB1; }
    .analysis-card.cat-time        { border-left-color: #06b6d4; }
    .analysis-card.cat-philosophical { border-left-color: #ec4899; }
    .analysis-card.cat-adoption    { border-left-color: var(--nu-gold); }
    .analysis-card.cat-synthesis   {
      background: linear-gradient(135deg, rgba(251,174,64,0.08) 0%, rgba(139,107,177,0.06) 100%);
      border-left-color: var(--nu-gold);
      border-left-width: 4px;
    }

    .analysis-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .analysis-tag {
      font-size: 10px;
      letter-spacing: 1.8px;
      color: var(--nu-gold);
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      background: rgba(251,174,64,0.12);
      border-radius: 6px;
      border: 1px solid rgba(251,174,64,0.25);
    }
    .analysis-card.cat-institutional .analysis-tag { color: #B89CDC; background: rgba(139,107,177,0.15); border-color: rgba(139,107,177,0.3); }
    .analysis-card.cat-time .analysis-tag          { color: #67e8f9; background: rgba(6,182,212,0.12); border-color: rgba(6,182,212,0.3); }
    .analysis-card.cat-philosophical .analysis-tag { color: #f9a8d4; background: rgba(236,72,153,0.12); border-color: rgba(236,72,153,0.3); }
    .analysis-title {
      font-size: 17px;
      font-weight: 600;
      color: rgba(255,255,255,0.95);
      letter-spacing: -0.2px;
    }
    .analysis-body {
      font-size: 14.5px;
      line-height: 1.65;
      color: rgba(255,255,255,0.82);
    }
    .analysis-body p { margin-bottom: 10px; }
    .analysis-body p:last-child { margin-bottom: 0; }
    .analysis-body strong { color: var(--nu-gold); font-weight: 700; }
    .analysis-body em { font-style: italic; color: rgba(255,255,255,0.7); }

    .analysis-stat-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .analysis-stat-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
    .analysis-stat-pill strong {
      color: var(--nu-gold);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .synthesis-card .analysis-title {
      font-size: 19px;
      font-weight: 700;
    }
    .synthesis-card .analysis-body {
      font-size: 15px;
    }

    /* ===== FOOTER ===== */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }
    .conn-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .conn-status .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
    }
    .conn-status.connected .dot {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .footer-actions {
      display: flex;
      gap: 16px;
    }
    .footer-action {
      color: var(--nu-gold);
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .footer-action:hover { opacity: 0.7; }

    /* ===== LOADING / EMPTY STATES ===== */
    .loading {
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.6);
    }
    .loading-spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--nu-gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: rgba(255,255,255,0.5);
      font-style: italic;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .dashboard { grid-template-columns: 1fr; }
      .insights { grid-template-columns: 1fr; }
      .commentary-text { font-size: 18px; }
    }
    @media (max-width: 640px) {
      .shell { padding: 20px 16px; }
      .header { flex-direction: column; align-items: flex-start; }
      .header-stats { width: 100%; }
      .stat-pod { flex: 1; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="shell">
    <div class="header">
      <div class="brand">
        <div class="brand-mark">📊</div>
        <div class="brand-text">
          <div class="brand-label">CTI · Northwestern Radiology</div>
          <div class="brand-title">Live Audience Analysis</div>
        </div>
      </div>
      <div class="header-stats">
        <div class="stat-pod">
          <div class="stat-num" id="q1-total">—</div>
          <div class="stat-lbl">Respondents</div>
        </div>
        <div class="stat-pod">
          <div class="stat-num" id="q2-total">—</div>
          <div class="stat-lbl">Barrier Picks</div>
        </div>
        <div class="stat-pod">
          <div class="stat-num" id="avg-barriers">—</div>
          <div class="stat-lbl">Barriers / Person</div>
        </div>
      </div>
    </div>

    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div>Fetching live results from CTI database…</div>
      </div>
    </div>

    <div class="footer">
      <div class="conn-status" id="conn-status">
        <span class="dot"></span>
        <span id="conn-text">Connecting…</span>
      </div>
      <div class="footer-actions">
        <a class="footer-action" id="refresh-btn">↻ Refresh now</a>
        <span style="color:rgba(255,255,255,0.3);">·</span>
        <span style="color:rgba(255,255,255,0.5);">Last update: <span id="last-update">—</span></span>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    //  CONFIGURATION — paste your Firebase database URL here
    // ============================================================
    const FIREBASE_DB = "https://cti-poll-2026-default-rtdb.firebaseio.com";
    const POLL_NAME = "cti_ai_workflow_2026_v2";
    const REFRESH_INTERVAL_MS = 5000;  // auto-refresh every 5 seconds
    // ============================================================

    const ADOPTION = [
      { key: "A", title: "Not yet",            desc: "Haven't started", tier: 0 },
      { key: "B", title: "Writing only",       desc: "Email, abstracts, documents", tier: 1 },
      { key: "C", title: "Coding helper",      desc: "Snippets, debugging", tier: 2 },
      { key: "D", title: "Data pipelines",     desc: "DICOM/NIfTI, parametric maps", tier: 3 },
      { key: "E", title: "Multi-step agentic", desc: "Tool use, file creation", tier: 4 },
      { key: "F", title: "Connected systems",  desc: "MCP, Claude Code, multi-agent", tier: 5 },
    ];

    const BARRIERS = [
      { key: "1", title: "Cost",                       desc: "Token bills, no institutional license" },
      { key: "2", title: "Time to learn",              desc: "Already overloaded" },
      { key: "3", title: "Lack of support",            desc: "No training, no community of practice" },
      { key: "4", title: "Data security & IRB",        desc: "PHI, sponsor data concerns" },
      { key: "5", title: "Output trust",               desc: "Hallucinations, verification" },
      { key: "6", title: "Intellectual reluctance",    desc: "Prefer to think it through myself" },
      { key: "7", title: "Career stage / priority",    desc: "Too senior to retrain, or too junior to risk it" },
      { key: "8", title: "Tooling friction",           desc: "Poor integration with existing tools" },
      { key: "9", title: "Environmental concerns",     desc: "Datacenter footprint" },
      { key: "0", title: "No interest",                desc: "Not convinced of value" },
    ];

    let refreshTimer = null;

    async function fetchPollData() {
      try {
        const r = await fetch(`${FIREBASE_DB}/polls/${POLL_NAME}.json`, { cache: 'no-store' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        renderAll(data || {});
        setConnected(true);
      } catch (e) {
        console.error('Fetch error:', e);
        setConnected(false);
        if (document.getElementById('content').querySelector('.loading')) {
          document.getElementById('content').innerHTML = `
            <div class="empty-state">
              ⚠ Could not reach the database. Check your network and try again.<br>
              <small style="margin-top:8px;display:block;">${e.message}</small>
            </div>`;
        }
      }
    }

    function setConnected(ok) {
      const status = document.getElementById('conn-status');
      const text = document.getElementById('conn-text');
      const lu = document.getElementById('last-update');
      if (ok) {
        status.classList.add('connected');
        text.textContent = 'Live · synced';
        const now = new Date();
        lu.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } else {
        status.classList.remove('connected');
        text.textContent = 'Connection lost';
      }
    }

    function renderAll(data) {
      const adoptionData = data.adoption || {};
      const barriersData = data.barriers || {};

      const q1Total = ADOPTION.reduce((s, o) => s + (adoptionData[o.key] || 0), 0);
      const q2Total = BARRIERS.reduce((s, o) => s + (barriersData[o.key] || 0), 0);
      const avgBarriers = q1Total > 0 ? (q2Total / q1Total).toFixed(1) : '0';

      document.getElementById('q1-total').textContent = q1Total;
      document.getElementById('q2-total').textContent = q2Total;
      document.getElementById('avg-barriers').textContent = avgBarriers;

      // Build hero commentary
      const commentary = buildCommentary(adoptionData, barriersData, q1Total, q2Total);

      // Render dashboard
      document.getElementById('content').innerHTML = `
        <div class="commentary-hero">
          <div class="commentary-label">Live Read · Auto-Generated</div>
          <div class="commentary-text">${commentary.headline}</div>
          ${commentary.followup ? `<div class="commentary-followup">${commentary.followup}</div>` : ''}
        </div>

        <div class="dashboard">
          <div class="panel q1">
            <div class="panel-title">Q1 · Adoption Level</div>
            <div class="panel-subtitle">How they currently use agentic AI</div>
            <div id="q1-bars"></div>
          </div>
          <div class="panel q2">
            <div class="panel-title">Q2 · Barriers to Adoption</div>
            <div class="panel-subtitle">What's holding them back (multi-select)</div>
            <div id="q2-bars"></div>
          </div>
        </div>

        <div class="insights">
          ${commentary.insights.map(ins => `
            <div class="insight-card">
              <div class="insight-label">${ins.label}</div>
              <div class="insight-text">${ins.text}</div>
            </div>
          `).join('')}
        </div>

        ${commentary.expandedAnalysis.length > 0 ? `
          <div class="section-divider">
            <span class="label">Expanded Analysis</span>
          </div>
          <div class="analysis-stack">
            ${commentary.expandedAnalysis.map(card => `
              <div class="analysis-card cat-${card.category}">
                <div class="analysis-header">
                  <span class="analysis-tag">${card.tag}</span>
                  <span class="analysis-title">${card.title}</span>
                </div>
                <div class="analysis-body">${card.body}</div>
                ${card.stats && card.stats.length > 0 ? `
                  <div class="analysis-stat-row">
                    ${card.stats.map(s => `<span class="analysis-stat-pill">${s.label} <strong>${s.value}</strong></span>`).join('')}
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${commentary.synthesis ? `
          <div class="section-divider">
            <span class="label">What This Means for Northwestern</span>
          </div>
          <div class="analysis-stack">
            <div class="analysis-card cat-synthesis synthesis-card">
              <div class="analysis-header">
                <span class="analysis-tag">Synthesis</span>
                <span class="analysis-title">${commentary.synthesis.title}</span>
              </div>
              <div class="analysis-body">${commentary.synthesis.body}</div>
            </div>
          </div>
        ` : ''}
      `;

      renderBars('q1-bars', ADOPTION, adoptionData, q1Total, false, commentary.topAdoption);
      renderBars('q2-bars', BARRIERS, barriersData, q1Total, true, commentary.topBarriers);
    }

    function renderBars(containerId, options, data, denominator, isMulti, highlightKeys) {
      const container = document.getElementById(containerId);
      let maxCount = 0;
      options.forEach(o => { maxCount = Math.max(maxCount, data[o.key] || 0); });

      options.forEach(opt => {
        const count = data[opt.key] || 0;
        const pct = denominator > 0 ? (count / denominator * 100) : 0;
        const barPct = maxCount > 0 ? (count / maxCount * 100) : 0;
        const isTop = highlightKeys.includes(opt.key);

        const row = document.createElement('div');
        row.className = 'bar-row' + (isMulti ? ' multi' : '') + (isTop ? ' top-pick' : '');
        row.innerHTML = `
          <div class="bar-letter">${opt.key}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:0%"></div>
            <div class="bar-label">${opt.title}</div>
          </div>
          <div class="bar-stats">
            <div class="count">${count}</div>
            <span class="pct">${pct.toFixed(1)}%</span>
          </div>`;
        container.appendChild(row);
        // animate fill in
        requestAnimationFrame(() => {
          row.querySelector('.bar-fill').style.width = `${Math.max(barPct, 0.5)}%`;
        });
      });
    }

    // ============================================================
    //  THE FANCY PART — templated, context-aware commentary
    // ============================================================
    function buildCommentary(adoption, barriers, q1Total, q2Total) {
      if (q1Total === 0) {
        return {
          headline: `Awaiting first votes — <span class="highlight">the room hasn't weighed in yet.</span>`,
          followup: `As soon as a few responses come in, this page will surface the patterns automatically.`,
          insights: [],
          expandedAnalysis: [],
          synthesis: null,
          topAdoption: [],
          topBarriers: [],
        };
      }

      // Find top adoption tier(s)
      const sortedAdoption = ADOPTION
        .map(o => ({ ...o, count: adoption[o.key] || 0 }))
        .sort((a, b) => b.count - a.count);
      const topAdoption = sortedAdoption[0];
      const topAdoptionPct = (topAdoption.count / q1Total * 100);

      // Find top barriers
      const sortedBarriers = BARRIERS
        .map(o => ({ ...o, count: barriers[o.key] || 0 }))
        .sort((a, b) => b.count - a.count)
        .filter(b => b.count > 0);
      const topBarriers = sortedBarriers.slice(0, 3);

      // Categorize the audience
      const earlyTiers = ['A', 'B'].reduce((s, k) => s + (adoption[k] || 0), 0);
      const midTiers   = ['C', 'D'].reduce((s, k) => s + (adoption[k] || 0), 0);
      const advTiers   = ['E', 'F'].reduce((s, k) => s + (adoption[k] || 0), 0);

      const earlyPct = (earlyTiers / q1Total * 100);
      const midPct   = (midTiers / q1Total * 100);
      const advPct   = (advTiers / q1Total * 100);

      // Build headline
      let headline = '';
      if (topAdoptionPct >= 40) {
        headline = `The room is concentrated at <span class="highlight">${topAdoption.key} — ${topAdoption.title}</span> (${topAdoptionPct.toFixed(0)}%).`;
      } else if (advPct > earlyPct && advPct > midPct) {
        headline = `The room skews <span class="highlight">advanced</span> — ${advPct.toFixed(0)}% are already running multi-step agents or connected systems.`;
      } else if (earlyPct > advPct && earlyPct > midPct) {
        headline = `The room is mostly <span class="highlight">early-stage</span> — ${earlyPct.toFixed(0)}% are either not started or using AI only for writing.`;
      } else if (midPct > earlyPct && midPct > advPct) {
        headline = `The room sits squarely in <span class="highlight">working-tool territory</span> — ${midPct.toFixed(0)}% use AI as a coding helper or for data pipelines.`;
      } else {
        headline = `The room is <span class="highlight">distributed across all adoption tiers</span> — no single level dominates.`;
      }

      // Add barrier context
      let followup = '';
      if (topBarriers.length > 0) {
        const topBarrier = topBarriers[0];
        const topBarrierPct = (topBarrier.count / q1Total * 100);
        if (topBarriers.length === 1) {
          followup = `The single dominant barrier is <strong>${topBarrier.title}</strong> (${topBarrierPct.toFixed(0)}% of respondents).`;
        } else {
          const second = topBarriers[1];
          followup = `The top barriers are <strong>${topBarrier.title}</strong> (${topBarrierPct.toFixed(0)}%) and <strong>${second.title}</strong> (${(second.count/q1Total*100).toFixed(0)}%) — that combination tells us what to address first.`;
        }
      }

      // Build insight cards
      const insights = [];

      // Insight 1: Distribution shape
      if (earlyPct >= 50) {
        insights.push({
          label: 'Distribution Shape',
          text: `<strong>${earlyPct.toFixed(0)}%</strong> of the room is still at the writing-or-below tier. The opportunity for tier C → D → E movement is large.`
        });
      } else if (advPct >= 35) {
        insights.push({
          label: 'Distribution Shape',
          text: `<strong>${advPct.toFixed(0)}%</strong> of the room is already at multi-step or connected-systems level. This is a more sophisticated audience than typical.`
        });
      } else {
        insights.push({
          label: 'Distribution Shape',
          text: `The room balances roughly <strong>${earlyPct.toFixed(0)}/${midPct.toFixed(0)}/${advPct.toFixed(0)}%</strong> across early, mid, and advanced tiers — a healthy mix.`
        });
      }

      // Insight 2: Barrier pattern
      if (topBarriers.length > 0) {
        const topBarrier = topBarriers[0];
        const structuralBarriers = ['3', '4', '8'];  // Lack of support, security, tooling
        const personalBarriers   = ['6', '7', '0'];  // Reluctance, career, no interest
        const resourceBarriers   = ['1', '2'];        // Cost, time

        const structPicks = structuralBarriers.reduce((s, k) => s + (barriers[k] || 0), 0);
        const persPicks   = personalBarriers.reduce((s, k) => s + (barriers[k] || 0), 0);
        const resPicks    = resourceBarriers.reduce((s, k) => s + (barriers[k] || 0), 0);

        let pattern = '';
        const totalPattern = structPicks + persPicks + resPicks;
        if (totalPattern > 0) {
          if (structPicks > persPicks && structPicks > resPicks) {
            pattern = `Mostly <strong>structural</strong> — support, security, integration. These are institutional problems with institutional solutions.`;
          } else if (resPicks > structPicks && resPicks > persPicks) {
            pattern = `Mostly <strong>resource constraints</strong> — cost and time. These respond to institutional licensing and protected experimentation time.`;
          } else if (persPicks > structPicks && persPicks > resPicks) {
            pattern = `Mostly <strong>personal / philosophical</strong> — reluctance, priority, interest. These need persuasion and demonstration, not infrastructure.`;
          } else {
            pattern = `<strong>Mixed</strong> across structural, resource, and personal categories — no single fix addresses the room.`;
          }
        }
        insights.push({ label: 'Barrier Pattern', text: pattern });
      }

      // Insight 3: Adoption × barrier coherence
      if (topBarriers.length > 0 && q1Total >= 3) {
        const topBarrierKey = topBarriers[0].key;
        const topBarrierTitle = topBarriers[0].title;
        let bridge = '';
        // Specific bridges between adoption tier and dominant barrier
        if (earlyPct >= 50) {
          if (topBarrierKey === '3') bridge = `Early-stage room + "${topBarrierTitle}" as top barrier — exactly the gap a CTI training program could close.`;
          else if (topBarrierKey === '4') bridge = `Early-stage room + security concerns — they need a sanctioned path more than they need new tools.`;
          else if (topBarrierKey === '2') bridge = `Early-stage room + "time to learn" — the activation energy problem. Pair-with-an-expert sessions help more than docs.`;
          else if (topBarrierKey === '1') bridge = `Early-stage room + cost — institutional licensing would unlock the largest segment fastest.`;
          else bridge = `Early-stage room with "${topBarrierTitle}" as the top barrier — start where the activation energy is lowest.`;
        } else if (advPct >= 35) {
          bridge = `Advanced users still cite "${topBarrierTitle}" — the barriers don't disappear with experience, they change shape.`;
        } else {
          bridge = `Mid-tier room + "${topBarrierTitle}" as top barrier — these are people who've started and hit a wall. Targeted unblockers, not introductions.`;
        }
        insights.push({ label: 'Bridge Insight', text: bridge });
      }

      // ============================================================
      //  EXPANDED ANALYSIS — full paragraphs for each top barrier
      //  category, plus an adoption-tier paragraph and a synthesis
      // ============================================================
      const expandedAnalysis = [];

      // — Always: a paragraph on the adoption distribution itself —
      if (q1Total >= 3) {
        const adoptionStats = [
          { label: 'Early (A–B)', value: `${earlyPct.toFixed(0)}%` },
          { label: 'Mid (C–D)',   value: `${midPct.toFixed(0)}%` },
          { label: 'Advanced (E–F)', value: `${advPct.toFixed(0)}%` },
        ];

        let adoptionBody = '';
        const tierDPct = ((adoption['D'] || 0) / q1Total * 100);
        const tierFPct = ((adoption['F'] || 0) / q1Total * 100);
        const tierD0 = (adoption['D'] || 0) === 0;
        const tierF0 = (adoption['F'] || 0) === 0;

        if (earlyPct >= 50) {
          adoptionBody = `<p>The room is concentrated in the writing-and-below tiers. <strong>${earlyPct.toFixed(0)}%</strong> of respondents are using AI either not at all or only for text polishing — a population that has seen the tool but not yet integrated it into their scientific workflow.</p>`;
          if (midPct > 0) {
            adoptionBody += `<p>The mid-tier (<strong>${midPct.toFixed(0)}%</strong>) is where the appetite for actual workflow integration starts to appear. This is the most actionable segment — they have momentum, they hit walls, and they want help.</p>`;
          }
        } else if (advPct >= 35) {
          adoptionBody = `<p>This is a more advanced audience than typical. <strong>${advPct.toFixed(0)}%</strong> are already at multi-step agentic or connected-systems level, meaning a meaningful fraction of the room is doing what most institutions consider "advanced" use of AI. The conversation here is less about <em>whether</em> to adopt and more about <em>how to scale and govern</em> what's already happening.</p>`;
        } else if (midPct >= 40) {
          adoptionBody = `<p>The center of mass sits in <strong>working-tool territory</strong> — coding helpers and data pipelines. This is a room that has moved past "is AI useful" and into "how do I make it actually work in my workflow." That's a more sophisticated starting point than headline statistics about AI adoption usually suggest.</p>`;
        } else {
          adoptionBody = `<p>The room is unusually balanced across tiers: <strong>${earlyPct.toFixed(0)}%</strong> early, <strong>${midPct.toFixed(0)}%</strong> mid, <strong>${advPct.toFixed(0)}%</strong> advanced. No single message will land for everyone — this audience benefits from a tiered framing more than a single recommendation.</p>`;
        }

        // Flag the D-gap if present
        if (tierD0 && q1Total >= 5) {
          adoptionBody += `<p><strong>Notable gap:</strong> zero respondents picked tier D (data pipelines). This is significant in an imaging-research audience. Either people aren't building data pipelines with AI, or those who are have already moved past calling them "pipelines" and self-identify as tier E. Either reading is interesting.</p>`;
        }
        if (tierF0 && advPct < 15) {
          adoptionBody += `<p>Tier F (connected systems — MCP, Claude Code, multi-agent orchestration) is also empty. This is the frontier that institutional infrastructure could unlock for the whole room.</p>`;
        }

        expandedAnalysis.push({
          category: 'adoption',
          tag: 'Adoption Profile',
          title: 'How the room actually uses AI today',
          body: adoptionBody,
          stats: adoptionStats,
        });
      }

      // — Barrier category paragraphs — surface 2-3 based on top barriers —
      const topBarrierKeys = topBarriers.slice(0, 3).map(b => b.key);

      // Trust & Verification (key 5: Output trust)
      if (topBarrierKeys.includes('5')) {
        const trustCount = barriers['5'] || 0;
        const trustPct = (trustCount / q1Total * 100);
        const rank = topBarrierKeys.indexOf('5') + 1;
        const intelReluctancePct = ((barriers['6'] || 0) / q1Total * 100);

        let body = `<p>The <strong>Output trust</strong> barrier is sitting at <strong>${trustPct.toFixed(0)}%</strong> of respondents (rank #${rank}). This isn't a "people don't want AI" signal — it's a "people have tried AI and watched it hallucinate" signal. It's the most common stopping point for users who got past the curiosity phase.</p>`;
        body += `<p>The fix is not more cheerleading. The fix is <em>structured verification</em>: workflows where AI output is checked against a known reference (a validated pipeline, a manual measurement, a second independent agent). The institutions that solve this barrier do so by treating AI output as <em>draft</em> rather than <em>answer</em>, and by giving people verification tooling — not just access.</p>`;
        if (intelReluctancePct < 20 && intelReluctancePct < trustPct) {
          body += `<p>Telling detail: "Intellectual reluctance" sits at only <strong>${intelReluctancePct.toFixed(0)}%</strong>. The room isn't philosophically resistant — they're <em>tactically</em> blocked. They want to use it. They just don't trust the output yet.</p>`;
        }

        expandedAnalysis.push({
          category: 'trust',
          tag: '⚠ Trust & Verification',
          title: 'The trust wall — the most common stopping point',
          body,
          stats: [
            { label: 'Output trust', value: `${trustPct.toFixed(0)}%` },
            { label: 'Intellectual reluctance', value: `${intelReluctancePct.toFixed(0)}%` },
            { label: 'Rank', value: `#${rank}` },
          ],
        });
      }

      // Institutional Block (keys 3 lack of support, 4 IRB/security, 1 cost)
      const instKeys = ['3', '4', '1'];
      const instInTop = instKeys.filter(k => topBarrierKeys.includes(k));
      if (instInTop.length > 0) {
        const supPct = ((barriers['3'] || 0) / q1Total * 100);
        const secPct = ((barriers['4'] || 0) / q1Total * 100);
        const cosPct = ((barriers['1'] || 0) / q1Total * 100);

        let body = `<p>Multiple barriers in the room are <strong>institutional, not personal</strong>: Lack of support (<strong>${supPct.toFixed(0)}%</strong>), Data security &amp; IRB (<strong>${secPct.toFixed(0)}%</strong>), and Cost (<strong>${cosPct.toFixed(0)}%</strong>). None of these are things an individual researcher can solve at their desk. They are decisions that have to be made by departments, by IT, by IRB committees, by deans.</p>`;
        if (secPct >= 25) {
          body += `<p>The <strong>Data security &amp; IRB</strong> piece is especially load-bearing for imaging research. Researchers don't actually know what's allowed — is a de-identified DICOM OK to send to Claude? Can sponsor data be touched? The absence of clear institutional guidance is itself the barrier. People aren't being reckless; they're being careful in the absence of rules.</p>`;
        }
        if (supPct >= 25) {
          body += `<p><strong>Lack of support</strong> at this level means people don't know who to ask — there is no Northwestern AI-for-research office, no training program, no community of practice. They are figuring it out alone, which is slow.</p>`;
        }
        body += `<p>The contrast with UChicago's announcement is direct: they are addressing this category at the institutional level — Claude Enterprise access for all faculty, faculty committees on AI in education and academic life, a CTO assigned to oversee the rollout. Those are not technical decisions. They are institutional ones.</p>`;

        expandedAnalysis.push({
          category: 'institutional',
          tag: '⚙ Institutional Block',
          title: 'Barriers that require institutional action, not individual effort',
          body,
          stats: [
            { label: 'Lack of support', value: `${supPct.toFixed(0)}%` },
            { label: 'Security/IRB', value: `${secPct.toFixed(0)}%` },
            { label: 'Cost', value: `${cosPct.toFixed(0)}%` },
          ],
        });
      }

      // Time & Activation (key 2: Time to learn)
      if (topBarrierKeys.includes('2')) {
        const timePct = ((barriers['2'] || 0) / q1Total * 100);
        const rank = topBarrierKeys.indexOf('2') + 1;

        let body = `<p>The <strong>Time to learn</strong> barrier (<strong>${timePct.toFixed(0)}%</strong>, rank #${rank}) is the activation-energy problem. People are interested. They've seen demos. They believe it could help. They cannot find the hours.</p>`;
        body += `<p>This barrier responds <em>poorly</em> to documentation and <em>well</em> to two specific interventions: (a) <strong>protected experimentation time</strong> — formally allocated, not "in your spare time" — and (b) <strong>pair-with-an-expert sessions</strong> — one hour with someone who already uses the tools, sitting alongside a real task. Both are institutional moves, not individual ones.</p>`;
        if (advPct >= 20) {
          body += `<p>Worth noting: the people in this room who <em>are</em> already at tier E or F didn't get there in their spare time either. They got there because something forced them to (a deadline, a grant, a problem too painful to solve manually). Activation energy almost always requires a forcing function.</p>`;
        }

        expandedAnalysis.push({
          category: 'time',
          tag: '⏱ Time & Activation',
          title: 'The activation-energy problem',
          body,
          stats: [
            { label: 'Time to learn', value: `${timePct.toFixed(0)}%` },
            { label: 'Rank', value: `#${rank}` },
          ],
        });
      }

      // Philosophical Block (keys 6 intellectual reluctance, 0 no interest, 7 career stage)
      const philKeys = ['6', '0', '7'];
      const philInTop = philKeys.filter(k => topBarrierKeys.includes(k));
      const intelPct = ((barriers['6'] || 0) / q1Total * 100);
      const noIntPct = ((barriers['0'] || 0) / q1Total * 100);
      const careerPct = ((barriers['7'] || 0) / q1Total * 100);

      if (philInTop.length > 0) {
        let body = `<p>A meaningful fraction of the room cites <strong>philosophical or career-stage</strong> objections — intellectual reluctance (<strong>${intelPct.toFixed(0)}%</strong>), no interest (<strong>${noIntPct.toFixed(0)}%</strong>), or career-stage concerns (<strong>${careerPct.toFixed(0)}%</strong>).</p>`;
        body += `<p>These barriers don't respond to infrastructure. They respond to <em>demonstration</em> — seeing a respected colleague use the tools on a real scientific problem, getting a real scientific result, and having the integrity of the work survive peer review. They also respond to honest discussion of <em>where AI shouldn't be used</em> — the absence of that conversation is itself part of what fuels the reluctance.</p>`;

        expandedAnalysis.push({
          category: 'philosophical',
          tag: '◇ Philosophical Block',
          title: 'Barriers that need demonstration, not infrastructure',
          body,
          stats: [
            { label: 'Intellectual reluctance', value: `${intelPct.toFixed(0)}%` },
            { label: 'No interest', value: `${noIntPct.toFixed(0)}%` },
            { label: 'Career stage', value: `${careerPct.toFixed(0)}%` },
          ],
        });
      } else if (noIntPct === 0 && q1Total >= 5) {
        // Special case: nobody is uninterested. Worth flagging as a positive signal.
        expandedAnalysis.push({
          category: 'philosophical',
          tag: '◇ What Isn\'t a Barrier',
          title: 'What this audience did NOT pick',
          body: `<p>Zero people picked <strong>"No interest"</strong>. Nobody in the room is philosophically opposed to using AI. Combined with the low rate of "Intellectual reluctance" (<strong>${intelPct.toFixed(0)}%</strong>), this tells you something important: <em>the room wants this</em>. They are not waiting to be convinced. They are waiting to be enabled.</p>`,
          stats: [
            { label: 'No interest', value: `${noIntPct.toFixed(0)}%` },
            { label: 'Intellectual reluctance', value: `${intelPct.toFixed(0)}%` },
          ],
        });
      }

      // ============================================================
      //  SYNTHESIS — connect Q1 distribution to Q2 top barriers
      // ============================================================
      let synthesis = null;
      if (q1Total >= 3 && topBarriers.length > 0) {
        const top1 = topBarriers[0];
        const top1Pct = (top1.count / q1Total * 100);

        let title = '';
        let body = '';

        if (earlyPct >= 50 && (topBarrierKeys.includes('3') || topBarrierKeys.includes('1'))) {
          title = 'An early-stage room blocked by institutional gaps';
          body = `<p>The room is mostly early-stage (<strong>${earlyPct.toFixed(0)}%</strong> at tier A or B), and the dominant barrier is something Northwestern itself could fix — support infrastructure, institutional licensing, or both. This is the cleanest possible case for institutional action: a population that wants to move forward, blocked by decisions that aren't theirs to make.</p>`;
          body += `<p>The single most leveraged move would be a <strong>Northwestern equivalent of UChicago's Claude Enterprise rollout</strong>: secured access, institutional licensing, and a small training program. That alone would move the largest segment of this room from tier B to tier C–D within a year.</p>`;
        } else if (topBarrierKeys.includes('5') && topBarrierKeys.includes('2')) {
          title = 'A working-tool audience hitting the trust + time double-bind';
          body = `<p>The center of mass is in working-tool tiers (C and D), and the two dominant barriers are <strong>Output trust</strong> (<strong>${((barriers['5']||0)/q1Total*100).toFixed(0)}%</strong>) and <strong>Time to learn</strong> (<strong>${((barriers['2']||0)/q1Total*100).toFixed(0)}%</strong>). These are the barriers of people who have tried, hit a wall, and don't have the bandwidth to grind through it alone.</p>`;
          body += `<p>The interventions that work for this combination are <em>not</em> introductory workshops. They are <strong>verification scaffolding</strong> (give people tools and patterns to check AI output against known references) and <strong>pair-programming-style sessions</strong> (one hour with an expert, applied to a real task). Generic training is a waste of effort for this audience.</p>`;
        } else if (topBarrierKeys.includes('4')) {
          title = 'A room blocked by ambiguity about what is allowed';
          body = `<p>Data security and IRB concerns rank in the top three barriers. In an imaging research environment this almost always means the same thing: <strong>nobody has told people what is OK</strong>. Is a de-identified DICOM OK to send to a commercial LLM? What about a coded subject ID? What about sponsor data under a DUA?</p>`;
          body += `<p>The fix is not better tools. The fix is a one-page institutional document — written by IRB, IT security, and research administration jointly — that says, in clear language, what data classifications are permitted in which AI tools. Until that document exists, careful researchers will continue to opt out of AI for safety reasons that are entirely rational.</p>`;
        } else if (advPct >= 35) {
          title = 'An advanced room asking the next-level questions';
          body = `<p>This room is unusually sophisticated — <strong>${advPct.toFixed(0)}%</strong> are already at agentic or connected-systems level. The barriers they cite are not "how do I start" barriers. They are <strong>governance and scale</strong> barriers: ${top1.title}, and the others in the top three.</p>`;
          body += `<p>The institutional response for this audience is different. They don't need training programs. They need <strong>infrastructure</strong>: institutional MCP servers, sanctioned access patterns, IRB clarity on agentic workflows, and explicit support for the people who are already doing the work.</p>`;
        } else {
          title = 'A mixed room with a clear top barrier';
          body = `<p>The room is spread across adoption tiers, and the dominant barrier is <strong>${top1.title}</strong> at <strong>${top1Pct.toFixed(0)}%</strong>. Because the audience is mixed, no single intervention reaches everyone — but addressing the top barrier reaches more of the room than anything else available.</p>`;
          body += `<p>The most productive next move is to design the response around <em>${top1.title.toLowerCase()}</em> specifically, accepting that a meaningful minority will need different interventions.</p>`;
        }

        // Closing line — always tie to action
        body += `<p><em>The audience handed you a thesis statement. The data says what to address first.</em></p>`;

        synthesis = { title, body };
      }

      return {
        headline,
        followup,
        insights,
        expandedAnalysis,
        synthesis,
        topAdoption: [topAdoption.key],
        topBarriers: topBarriers.slice(0, 2).map(b => b.key),
      };
    }

    // Initial fetch + auto-refresh
    fetchPollData();
    refreshTimer = setInterval(fetchPollData, REFRESH_INTERVAL_MS);

    document.getElementById('refresh-btn').addEventListener('click', (e) => {
      e.preventDefault();
      fetchPollData();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4E2A84">
  <title>CTI · AI Workflow Poll</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">

  <style>
    :root {
      --nu-purple: #4E2A84;
      --nu-purple-deep: #3D1B6E;
      --nu-purple-mid: #544586;
      --nu-purple-light: #8B6BB1;
      --nu-purple-pale: #EDE9F5;
      --nu-gold: #FBAE40;
      --nu-white: #FFFFFF;
      --nu-gray: #555759;
      --nu-gray-light: #A0A0A5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(135deg, var(--nu-purple) 0%, var(--nu-purple-deep) 100%);
      min-height: 100vh; min-height: 100dvh;
      color: var(--nu-white);
      overflow-x: hidden;
    }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .container { max-width: 680px; margin: 0 auto; padding: 16px; }

    .voter-header { text-align: center; padding: 18px 0 10px; }
    .voter-header .brand { font-size: 12px; letter-spacing: 2.4px; color: var(--nu-gold); font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
    .voter-header h1 { font-size: 22px; font-weight: 700; line-height: 1.2; margin-bottom: 6px; letter-spacing: -0.5px; }
    .voter-header .subtitle { font-size: 13px; color: rgba(255,255,255,0.75); font-style: italic; }

    .question-tabs { display: flex; gap: 6px; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 4px; margin: 14px 0; }
    .tab-btn { flex: 1; background: transparent; color: rgba(255,255,255,0.7); border: none; padding: 12px 8px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    .tab-btn.active { background: var(--nu-gold); color: var(--nu-purple-deep); }
    .tab-btn .tab-status { display: block; font-size: 10px; font-weight: 400; opacity: 0.8; margin-top: 2px; }

    .question-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border-radius: 16px; padding: 16px 18px; margin: 12px 0; border: 1px solid rgba(255,255,255,0.12); }
    .question-card .question-text { font-size: 16px; font-weight: 600; line-height: 1.35; }
    .question-card .question-hint { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 6px; font-style: italic; }

    .vote-options { display: flex; flex-direction: column; gap: 9px; padding: 6px 0 16px; }
    .option-button { display: flex; align-items: center; gap: 14px; background: white; color: var(--nu-purple-deep); border: 2px solid white; border-radius: 14px; padding: 12px 14px; cursor: pointer; transition: all 0.2s ease; text-align: left; font-family: inherit; width: 100%; }
    .option-button:active { transform: scale(0.98); }
    .option-button.selected { background: var(--nu-gold); color: var(--nu-purple-deep); border-color: var(--nu-gold); box-shadow: 0 6px 18px rgba(251,174,64,0.4); }
    .option-letter { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: var(--nu-purple); color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; position: relative; }
    .option-button.selected .option-letter { background: var(--nu-purple-deep); color: var(--nu-gold); }
    .option-button.multi .option-letter { border-radius: 8px; }
    .option-button.multi.selected .option-letter::after { content: '✓'; position: absolute; font-size: 10px; color: var(--nu-purple-deep); background: var(--nu-gold); width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; top: -6px; right: -6px; font-weight: 900; border: 2px solid white; }
    .option-content { flex: 1; min-width: 0; }
    .option-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .option-desc { font-size: 12.5px; color: var(--nu-gray); line-height: 1.3; }

    .vote-confirm { margin-top: 10px; padding: 12px; background: rgba(251,174,64,0.15); border: 1px solid rgba(251,174,64,0.5); border-radius: 12px; text-align: center; font-size: 13px; color: var(--nu-gold); }
    .voter-footer { text-align: center; padding: 10px 16px 24px; font-size: 11px; color: rgba(255,255,255,0.5); }

    .presenter-shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 22px; }
    .presenter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 20px; }
    .presenter-title h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .presenter-title .sub { color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 4px; }
    .presenter-stats { display: flex; gap: 12px; align-items: center; }
    .stat-card { background: rgba(255,255,255,0.08); padding: 10px 18px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.12); }
    .stat-number { font-size: 28px; font-weight: 800; color: var(--nu-gold); line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 9px; letter-spacing: 1.4px; color: rgba(255,255,255,0.7); margin-top: 4px; text-transform: uppercase; font-weight: 600; }

    .dashboard-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
    .panel { background: rgba(255,255,255,0.05); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.08); min-height: 0; overflow-y: auto; }
    .panel-title { font-size: 13px; letter-spacing: 1.4px; color: var(--nu-gold); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .panel-subtitle { font-size: 11px; color: rgba(255,255,255,0.55); margin-bottom: 14px; font-style: italic; }

    .bar-row { display: grid; grid-template-columns: 38px 1fr 90px; gap: 10px; align-items: center; margin-bottom: 8px; }
    .bar-letter { width: 32px; height: 32px; border-radius: 50%; background: var(--nu-purple-mid); color: white; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
    .bar-row.multi .bar-letter { border-radius: 7px; width: 28px; height: 28px; font-size: 12px; }
    .bar-track { position: relative; height: 32px; background: rgba(255,255,255,0.05); border-radius: 6px; overflow: hidden; }
    .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--nu-purple-light), var(--nu-gold)); border-radius: 6px; transition: width 0.6s cubic-bezier(0.4, 0.0, 0.2, 1); }
    .bar-label { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 600; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.6); z-index: 2; white-space: nowrap; max-width: calc(100% - 18px); overflow: hidden; text-overflow: ellipsis; }
    .bar-stats { font-size: 14px; font-weight: 700; color: white; text-align: right; font-variant-numeric: tabular-nums; }
    .bar-stats .count { color: var(--nu-gold); font-size: 16px; }
    .bar-stats .pct { font-size: 11px; color: rgba(255,255,255,0.6); display: block; font-weight: 500; }

    .qr-panel { position: fixed; bottom: 22px; right: 22px; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.4); text-align: center; color: var(--nu-purple-deep); }
    .qr-panel img { display: block; }
    .qr-url { font-size: 9px; margin-top: 6px; color: var(--nu-purple); font-weight: 600; max-width: 160px; word-break: break-all; }
    .qr-panel .qr-label { font-size: 10px; color: var(--nu-gray); margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }

    .reset-button { position: fixed; top: 22px; right: 22px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 11px; font-family: inherit; }
    .reset-button:hover { background: rgba(255,255,255,0.2); }

    .connection-status { position: fixed; bottom: 22px; left: 22px; font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 1px; text-transform: uppercase; }
    .connection-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 6px; vertical-align: middle; }
    .connection-status.connected .dot { background: #22c55e; }

    .config-error { max-width: 600px; margin: 60px auto; padding: 24px; background: rgba(255,255,255,0.1); border-radius: 12px; border-left: 4px solid var(--nu-gold); }
    .config-error h2 { color: var(--nu-gold); margin-bottom: 12px; }
    .config-error code { display: block; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 6px; margin: 12px 0; font-size: 12px; color: #ffd; overflow-x: auto; }

    @media (max-width: 1024px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .qr-panel { display: none; }
    }
    @media (max-width: 768px) {
      .presenter-shell { padding: 14px; }
      .presenter-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div style="text-align:center;padding:60px 20px;">
      <div style="font-size:14px;opacity:0.6;">Loading poll…</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction, remove }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // ============================================================
    //  CONFIGURATION — Replace with YOUR Firebase project values
    //  (Keep the same Firebase project as before — only the
    //   POLL_NAME below has changed to avoid mixing with old data)
    // ============================================================
    const firebaseConfig = {
  apiKey: "AIzaSyDbR8lxSfCGEoD5NvVes3be2m_Byj5FtiQ",
  authDomain: "cti-poll-2026.firebaseapp.com",
  databaseURL: "https://cti-poll-2026-default-rtdb.firebaseio.com",
  projectId: "cti-poll-2026",
  storageBucket: "cti-poll-2026.firebasestorage.app",
  messagingSenderId: "78188314378",
  appId: "1:78188314378:web:478b8a6b64de3a2f0bc4f3"
};
    const POLL_NAME = "cti_ai_workflow_2026_v2";
    // ============================================================

    const params = new URLSearchParams(window.location.search);
    const isPresenter = params.get('mode') === 'present';

    if (firebaseConfig.apiKey === "PASTE_YOUR_API_KEY_HERE") {
      document.getElementById('app').innerHTML = `
        <div class="config-error">
          <h2>⚠ Firebase not configured</h2>
          <p>Replace the placeholder values in the <code>firebaseConfig</code> object near the top of the script with your Firebase project's config.</p>
          <p>See <code>POLL_SETUP.md</code> for instructions.</p>
        </div>`;
      throw new Error('Firebase config missing');
    }

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const adoptionRef = ref(db, `polls/${POLL_NAME}/adoption`);
    const barriersRef = ref(db, `polls/${POLL_NAME}/barriers`);

    const ADOPTION_OPTIONS = [
      { key: "A", title: "Not yet",            desc: "Curious but haven't started" },
      { key: "B", title: "Writing only",       desc: "Email, document polishing, abstracts" },
      { key: "C", title: "Coding helper",      desc: "Snippets, debugging, script generation" },
      { key: "D", title: "Data pipelines",     desc: "DICOM/NIfTI parsing, parametric maps, automation" },
      { key: "E", title: "Multi-step agentic", desc: "Multi-turn dialogue, tool use, file creation" },
      { key: "F", title: "Connected systems",  desc: "MCP connectors, Claude Code, multi-agent orchestration" },
    ];

    const BARRIER_OPTIONS = [
      { key: "1", title: "Cost",                       desc: "Token bills, paid plans, no institutional license" },
      { key: "2", title: "Time to learn",              desc: "Already overloaded; no room to experiment" },
      { key: "3", title: "Lack of support",            desc: "No one at NU to ask, no training, no community of practice" },
      { key: "4", title: "Data security & IRB",        desc: "PHI, sponsor data, unsure what's allowed" },
      { key: "5", title: "Output trust",               desc: "Hallucinations, can't verify, scientific accountability" },
      { key: "6", title: "Intellectual reluctance",    desc: "Prefer to think it through myself; over-reliance concerns" },
      { key: "7", title: "Career stage / priority",    desc: "Too senior to retrain — or too junior to risk experimenting" },
      { key: "8", title: "Tooling friction",           desc: "Poor integration with ImageJ, MATLAB, scanner consoles" },
      { key: "9", title: "Environmental concerns",     desc: "Datacenter water and energy footprint" },
      { key: "0", title: "No interest",                desc: "Genuinely not curious or convinced of the value" },
    ];

    if (isPresenter) renderPresenter();
    else renderVoter();

    function renderVoter() {
      const ADOPT_KEY = `cti_poll_adoption_${POLL_NAME}`;
      const BARR_KEY  = `cti_poll_barriers_${POLL_NAME}`;
      let adoptionVote = localStorage.getItem(ADOPT_KEY) || null;
      let barrierVotes = JSON.parse(localStorage.getItem(BARR_KEY) || '[]');
      let activeTab = 'adoption';

      const appEl = document.getElementById('app');
      appEl.innerHTML = `
        <div class="container">
          <div class="voter-header">
            <div class="brand">CTI · Northwestern Radiology</div>
            <h1>AI Workflow — Audience Poll</h1>
            <div class="subtitle">Two questions, anonymous, change your answers any time</div>
          </div>
          <div class="question-tabs">
            <button class="tab-btn active" data-tab="adoption">
              Q1 · Adoption Level
              <span class="tab-status" id="tab-status-adoption">tap to vote</span>
            </button>
            <button class="tab-btn" data-tab="barriers">
              Q2 · Barriers
              <span class="tab-status" id="tab-status-barriers">tap to vote</span>
            </button>
          </div>
          <div id="question-area"></div>
          <div class="voter-footer">Anonymous · aggregated results displayed at the front.</div>
        </div>`;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTab = btn.dataset.tab;
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
          renderQuestion();
        });
      });
      renderQuestion();
      updateTabStatus();

      function renderQuestion() {
        const area = document.getElementById('question-area');
        if (activeTab === 'adoption') {
          area.innerHTML = `
            <div class="question-card">
              <div class="question-text">Q1. How are YOU currently using agentic AI in your work?</div>
              <div class="question-hint">Pick ONE that best describes your current state.</div>
            </div>
            <div class="vote-options" id="adoption-options"></div>
            <div id="adoption-confirm"></div>`;
          const optEl = document.getElementById('adoption-options');
          ADOPTION_OPTIONS.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-button' + (adoptionVote === opt.key ? ' selected' : '');
            btn.dataset.key = opt.key;
            btn.innerHTML = `
              <div class="option-letter">${opt.key}</div>
              <div class="option-content">
                <div class="option-title">${opt.title}</div>
                <div class="option-desc">${opt.desc}</div>
              </div>`;
            btn.addEventListener('click', () => castAdoption(opt.key));
            optEl.appendChild(btn);
          });
          updateAdoptionConfirm();
        } else {
          area.innerHTML = `
            <div class="question-card">
              <div class="question-text">Q2. What's holding you (or others around you) back?</div>
              <div class="question-hint">Pick AS MANY as apply. Tap again to deselect.</div>
            </div>
            <div class="vote-options" id="barrier-options"></div>
            <div id="barrier-confirm"></div>`;
          const optEl = document.getElementById('barrier-options');
          BARRIER_OPTIONS.forEach(opt => {
            const btn = document.createElement('button');
            const isSelected = barrierVotes.includes(opt.key);
            btn.className = 'option-button multi' + (isSelected ? ' selected' : '');
            btn.dataset.key = opt.key;
            btn.innerHTML = `
              <div class="option-letter">${opt.key}</div>
              <div class="option-content">
                <div class="option-title">${opt.title}</div>
                <div class="option-desc">${opt.desc}</div>
              </div>`;
            btn.addEventListener('click', () => toggleBarrier(opt.key));
            optEl.appendChild(btn);
          });
          updateBarrierConfirm();
        }
      }

      function updateTabStatus() {
        document.getElementById('tab-status-adoption').textContent =
          adoptionVote ? `✓ Answered (${adoptionVote})` : 'tap to vote';
        document.getElementById('tab-status-barriers').textContent =
          barrierVotes.length > 0 ? `✓ ${barrierVotes.length} selected` : 'tap to vote';
      }

      async function castAdoption(newKey) {
        const oldKey = adoptionVote;
        if (oldKey === newKey) return;
        adoptionVote = newKey;
        localStorage.setItem(ADOPT_KEY, newKey);
        document.querySelectorAll('#adoption-options .option-button').forEach(b => {
          b.classList.toggle('selected', b.dataset.key === newKey);
        });
        updateAdoptionConfirm();
        updateTabStatus();
        try {
          if (oldKey) await runTransaction(ref(db, `polls/${POLL_NAME}/adoption/${oldKey}`), c => Math.max((c || 0) - 1, 0));
          await runTransaction(ref(db, `polls/${POLL_NAME}/adoption/${newKey}`), c => (c || 0) + 1);
        } catch (e) { console.error('Adoption vote error:', e); }
      }

      async function toggleBarrier(key) {
        const wasSelected = barrierVotes.includes(key);
        if (wasSelected) barrierVotes = barrierVotes.filter(k => k !== key);
        else barrierVotes.push(key);
        localStorage.setItem(BARR_KEY, JSON.stringify(barrierVotes));
        document.querySelector(`#barrier-options .option-button[data-key="${key}"]`).classList.toggle('selected', !wasSelected);
        updateBarrierConfirm();
        updateTabStatus();
        try {
          await runTransaction(
            ref(db, `polls/${POLL_NAME}/barriers/${key}`),
            c => wasSelected ? Math.max((c || 0) - 1, 0) : (c || 0) + 1
          );
        } catch (e) { console.error('Barrier vote error:', e); }
      }

      function updateAdoptionConfirm() {
        const c = document.getElementById('adoption-confirm'); if (!c) return;
        if (adoptionVote) {
          const opt = ADOPTION_OPTIONS.find(o => o.key === adoptionVote);
          c.innerHTML = `<div class="vote-confirm">✓ Your Q1 answer: <strong>${adoptionVote} — ${opt.title}</strong>
            <div style="font-size:11px;margin-top:4px;color:rgba(251,174,64,0.7);">Tap a different option to change.</div></div>`;
        } else c.innerHTML = '';
      }
      function updateBarrierConfirm() {
        const c = document.getElementById('barrier-confirm'); if (!c) return;
        if (barrierVotes.length > 0) {
          const titles = barrierVotes.map(k => BARRIER_OPTIONS.find(o => o.key === k).title).join(', ');
          c.innerHTML = `<div class="vote-confirm">✓ Your Q2 answers (${barrierVotes.length}): <strong>${titles}</strong>
            <div style="font-size:11px;margin-top:4px;color:rgba(251,174,64,0.7);">Tap to add or remove any.</div></div>`;
        } else c.innerHTML = '';
      }
    }

    function renderPresenter() {
      const appEl = document.getElementById('app');
      const voterUrl = window.location.origin + window.location.pathname;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(voterUrl)}&bgcolor=ffffff&color=4E2A84&margin=2`;

      appEl.innerHTML = `
        <div class="presenter-shell">
          <div class="presenter-header">
            <div class="presenter-title">
              <h1>Live Audience Poll · AI Workflow</h1>
              <div class="sub">CTI · Northwestern Radiology · ${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</div>
            </div>
            <div class="presenter-stats">
              <div class="stat-card">
                <div class="stat-number" id="adoption-total">0</div>
                <div class="stat-label">Q1 Responses</div>
              </div>
              <div class="stat-card">
                <div class="stat-number" id="barrier-total">0</div>
                <div class="stat-label">Q2 Selections</div>
              </div>
            </div>
          </div>
          <div class="dashboard-grid">
            <div class="panel">
              <div class="panel-title">Q1 · Adoption Level</div>
              <div class="panel-subtitle">How they currently use agentic AI (one answer per person)</div>
              <div id="adoption-bars"></div>
            </div>
            <div class="panel">
              <div class="panel-title">Q2 · Barriers to Adoption</div>
              <div class="panel-subtitle">What's holding them back (multiple answers allowed)</div>
              <div id="barrier-bars"></div>
            </div>
          </div>
          <button class="reset-button" id="reset-btn">⟳  Reset Both Polls</button>
          <div class="qr-panel">
            <div class="qr-label">Vote Here</div>
            <img src="${qrUrl}" width="160" height="160" alt="Scan to vote">
            <div class="qr-url">${voterUrl}</div>
          </div>
          <div class="connection-status" id="conn-status"><span class="dot"></span> Connecting...</div>
        </div>`;

      function buildBars(containerId, options, isMulti) {
        const container = document.getElementById(containerId);
        options.forEach(opt => {
          const row = document.createElement('div');
          row.className = 'bar-row' + (isMulti ? ' multi' : '');
          row.innerHTML = `
            <div class="bar-letter">${opt.key}</div>
            <div class="bar-track">
              <div class="bar-fill" id="${containerId}-fill-${opt.key}" style="width:0%"></div>
              <div class="bar-label">${opt.title}</div>
            </div>
            <div class="bar-stats">
              <span class="count" id="${containerId}-count-${opt.key}">0</span>
              <span class="pct" id="${containerId}-pct-${opt.key}">0%</span>
            </div>`;
          container.appendChild(row);
        });
      }
      buildBars('adoption-bars', ADOPTION_OPTIONS, false);
      buildBars('barrier-bars',  BARRIER_OPTIONS,  true);

      let adoptionTotal = 0;

      onValue(adoptionRef, (snap) => {
        const data = snap.val() || {};
        adoptionTotal = 0;
        ADOPTION_OPTIONS.forEach(opt => { adoptionTotal += (data[opt.key] || 0); });
        document.getElementById('adoption-total').textContent = adoptionTotal;
        document.getElementById('conn-status').className = 'connection-status connected';
        document.getElementById('conn-status').innerHTML = '<span class="dot"></span> Live · synced';

        let maxCount = 0;
        ADOPTION_OPTIONS.forEach(opt => { maxCount = Math.max(maxCount, data[opt.key] || 0); });

        ADOPTION_OPTIONS.forEach(opt => {
          const count = data[opt.key] || 0;
          const pct = adoptionTotal > 0 ? (count / adoptionTotal * 100) : 0;
          const barPct = maxCount > 0 ? (count / maxCount * 100) : 0;
          document.getElementById(`adoption-bars-count-${opt.key}`).textContent = count;
          document.getElementById(`adoption-bars-pct-${opt.key}`).textContent = `${pct.toFixed(1)}%`;
          document.getElementById(`adoption-bars-fill-${opt.key}`).style.width = `${Math.max(barPct, 0.5)}%`;
        });
      }, e => {
        console.error('Adoption listener error:', e);
        document.getElementById('conn-status').innerHTML = '<span class="dot"></span> Connection lost';
      });

      onValue(barriersRef, (snap) => {
        const data = snap.val() || {};
        let totalSelections = 0;
        BARRIER_OPTIONS.forEach(opt => { totalSelections += (data[opt.key] || 0); });
        document.getElementById('barrier-total').textContent = totalSelections;

        let maxCount = 0;
        BARRIER_OPTIONS.forEach(opt => { maxCount = Math.max(maxCount, data[opt.key] || 0); });
        // Use Q1 respondents (adoptionTotal) as denominator when available
        // — gives "% of respondents who picked this barrier"
        const denom = adoptionTotal > 0 ? adoptionTotal : (totalSelections || 1);

        BARRIER_OPTIONS.forEach(opt => {
          const count = data[opt.key] || 0;
          const pct = denom > 0 ? (count / denom * 100) : 0;
          const barPct = maxCount > 0 ? (count / maxCount * 100) : 0;
          document.getElementById(`barrier-bars-count-${opt.key}`).textContent = count;
          document.getElementById(`barrier-bars-pct-${opt.key}`).textContent = `${pct.toFixed(1)}%`;
          document.getElementById(`barrier-bars-fill-${opt.key}`).style.width = `${Math.max(barPct, 0.5)}%`;
        });
      }, e => { console.error('Barrier listener error:', e); });

      document.getElementById('reset-btn').addEventListener('click', async () => {
        if (!confirm('Reset BOTH polls (adoption + barriers) to zero? This cannot be undone.')) return;
        try { await remove(ref(db, `polls/${POLL_NAME}`)); } catch (e) { alert('Reset failed: ' + e.message); }
      });
    }
  </script>
</body>
</html>

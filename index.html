<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4E2A84">
  <title>CTI · AI Workflow Poll</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">

  <style>
    :root {
      --nu-purple: #4E2A84;
      --nu-purple-deep: #3D1B6E;
      --nu-purple-mid: #544586;
      --nu-purple-light: #8B6BB1;
      --nu-purple-pale: #EDE9F5;
      --nu-gold: #FBAE40;
      --nu-white: #FFFFFF;
      --nu-gray: #555759;
      --nu-gray-light: #A0A0A5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(135deg, var(--nu-purple) 0%, var(--nu-purple-deep) 100%);
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--nu-white);
      overflow-x: hidden;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .container { max-width: 680px; margin: 0 auto; padding: 16px; }

    /* ===== VOTER VIEW ===== */
    .voter-header { text-align: center; padding: 24px 0 16px; }
    .voter-header .brand { font-size: 12px; letter-spacing: 2.4px; color: var(--nu-gold); font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
    .voter-header h1 { font-size: 26px; font-weight: 700; line-height: 1.2; margin-bottom: 8px; letter-spacing: -0.5px; }
    .voter-header .subtitle { font-size: 14px; color: rgba(255,255,255,0.75); font-style: italic; }

    .question-card {
      background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
      border-radius: 16px; padding: 18px 20px; margin: 18px 0;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .question-card .question-text { font-size: 17px; font-weight: 600; line-height: 1.35; }
    .question-card .question-hint { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 8px; font-style: italic; }

    .vote-options { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 24px; }

    .option-button {
      display: flex; align-items: center; gap: 14px;
      background: white; color: var(--nu-purple-deep);
      border: 2px solid white; border-radius: 14px;
      padding: 14px 16px; cursor: pointer;
      transition: all 0.2s ease; text-align: left;
      font-family: inherit; width: 100%;
    }
    .option-button:active { transform: scale(0.98); }
    .option-button.selected {
      background: var(--nu-gold); color: var(--nu-purple-deep);
      border-color: var(--nu-gold); transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(251,174,64,0.4);
    }

    .option-letter {
      flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%;
      background: var(--nu-purple); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 21px; font-weight: 700;
    }
    .option-button.selected .option-letter { background: var(--nu-purple-deep); color: var(--nu-gold); }

    .option-content { flex: 1; min-width: 0; }
    .option-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .option-desc { font-size: 12.5px; color: var(--nu-gray); line-height: 1.3; }

    .vote-confirm {
      margin-top: 12px; padding: 14px;
      background: rgba(251,174,64,0.15);
      border: 1px solid rgba(251,174,64,0.5);
      border-radius: 12px; text-align: center;
      font-size: 14px; color: var(--nu-gold);
    }

    .voter-footer { text-align: center; padding: 12px 16px 24px; font-size: 11px; color: rgba(255,255,255,0.5); }

    /* ===== PRESENTER VIEW ===== */
    .presenter-shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 28px; }
    .presenter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; gap: 20px; }
    .presenter-title h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    .presenter-title .sub { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 4px; }

    .presenter-stats { display: flex; gap: 16px; align-items: center; }
    .stat-card {
      background: rgba(255,255,255,0.08); padding: 12px 22px;
      border-radius: 12px; text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .stat-number { font-size: 38px; font-weight: 800; color: var(--nu-gold); line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 10px; letter-spacing: 1.5px; color: rgba(255,255,255,0.7); margin-top: 6px; text-transform: uppercase; font-weight: 600; }

    .chart-area {
      flex: 1; background: rgba(255,255,255,0.05);
      border-radius: 16px; padding: 24px;
      display: flex; flex-direction: column; gap: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .bar-row {
      display: grid; grid-template-columns: 56px 1fr 130px;
      gap: 14px; align-items: center;
    }
    .bar-letter {
      width: 46px; height: 46px; border-radius: 50%;
      background: var(--nu-purple-mid); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 21px; font-weight: 700;
    }
    .bar-track {
      position: relative; height: 46px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px; overflow: hidden;
    }
    .bar-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, var(--nu-purple-light), var(--nu-gold));
      border-radius: 8px;
      transition: width 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .bar-label {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 14px; font-weight: 600; color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6); z-index: 2;
      white-space: nowrap; max-width: calc(100% - 28px);
      overflow: hidden; text-overflow: ellipsis;
    }
    .bar-stats { font-size: 22px; font-weight: 800; color: white; text-align: right; font-variant-numeric: tabular-nums; }
    .bar-stats .count { color: var(--nu-gold); }
    .bar-stats .pct { font-size: 13px; color: rgba(255,255,255,0.6); display: block; font-weight: 500; }

    .qr-panel {
      position: fixed; bottom: 24px; right: 24px;
      background: white; padding: 14px; border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      text-align: center; color: var(--nu-purple-deep);
    }
    .qr-panel img { display: block; }
    .qr-url { font-size: 10px; margin-top: 8px; color: var(--nu-purple); font-weight: 600; max-width: 180px; word-break: break-all; }
    .qr-panel .qr-label { font-size: 11px; color: var(--nu-gray); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }

    .reset-button {
      position: fixed; top: 24px; right: 24px;
      background: rgba(255,255,255,0.1); color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 16px; border-radius: 8px;
      cursor: pointer; font-size: 12px;
      font-family: inherit;
    }
    .reset-button:hover { background: rgba(255,255,255,0.2); }

    .connection-status {
      position: fixed; bottom: 24px; left: 24px;
      font-size: 11px; color: rgba(255,255,255,0.5);
      letter-spacing: 1px; text-transform: uppercase;
    }
    .connection-status .dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: #ef4444; margin-right: 6px;
      vertical-align: middle;
    }
    .connection-status.connected .dot { background: #22c55e; }

    /* ===== ERROR STATE ===== */
    .config-error {
      max-width: 600px; margin: 60px auto; padding: 24px;
      background: rgba(255,255,255,0.1); border-radius: 12px;
      border-left: 4px solid var(--nu-gold);
    }
    .config-error h2 { color: var(--nu-gold); margin-bottom: 12px; }
    .config-error code {
      display: block; background: rgba(0,0,0,0.3); padding: 12px;
      border-radius: 6px; margin: 12px 0; font-size: 12px;
      color: #ffd; overflow-x: auto;
    }

    @media (max-width: 768px) {
      .presenter-shell { padding: 16px; }
      .presenter-header { flex-direction: column; align-items: flex-start; }
      .qr-panel { display: none; }
      .bar-row { grid-template-columns: 40px 1fr 70px; gap: 8px; }
      .bar-letter { width: 36px; height: 36px; font-size: 17px; }
      .bar-track { height: 36px; }
      .bar-label { font-size: 12px; }
      .bar-stats { font-size: 16px; }
      .bar-stats .pct { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div style="text-align:center;padding:60px 20px;">
      <div style="font-size:14px;opacity:0.6;">Loading poll…</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction, remove }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // ============================================================
    //  CONFIGURATION — Replace with YOUR Firebase project values
    //  (See POLL_SETUP.md for instructions — takes ~15 minutes)
    // ============================================================
    const firebaseConfig = {
      apiKey: "const firebaseConfig = {
      apiKey: "AIzaSyDbR8lxSfCGEoD5NvVes3be2m_Byj5FtiQ",
      authDomain: "cti-poll-2026.firebaseapp.com",
      databaseURL: "https://cti-poll-2026-default-rtdb.firebaseio.com",
      projectId: "cti-poll-2026",
      storageBucket: "cti-poll-2026.firebasestorage.app",
      messagingSenderId: "78188314378",
      appId: "1:78188314378:web:478b8a6b64de3a2f0bc4f3"
    };,
      authDomain: "your-project.firebaseapp.com",
      databaseURL: "https://your-project-default-rtdb.firebaseio.com",
      projectId: "your-project",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "000000000000",
      appId: "1:000000000000:web:xxxxxxxxxxxxx"
    };

    const POLL_NAME = "cti_ai_workflow_2026";
    // ============================================================

    // Detect mode
    const params = new URLSearchParams(window.location.search);
    const isPresenter = params.get('mode') === 'present';

    // Validate config
    if (firebaseConfig.apiKey === "PASTE_YOUR_API_KEY_HERE") {
      document.getElementById('app').innerHTML = `
        <div class="config-error">
          <h2>⚠ Firebase not configured</h2>
          <p>This page needs Firebase credentials before it will work.</p>
          <p>Open the file in a text editor and replace the placeholder values inside the <code>firebaseConfig</code> object near the top of the <code>&lt;script&gt;</code> tag.</p>
          <p>See <code>POLL_SETUP.md</code> for step-by-step instructions (about 15 minutes, free).</p>
        </div>`;
      throw new Error('Firebase config missing');
    }

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const totalsRef = ref(db, `polls/${POLL_NAME}/totals`);

    const OPTIONS = [
      { key: "A", title: "Not yet",            desc: "Curious but haven't started" },
      { key: "B", title: "Writing only",       desc: "Email, document polishing, abstracts" },
      { key: "C", title: "Coding helper",      desc: "Snippets, debugging, script generation" },
      { key: "D", title: "Data pipelines",     desc: "DICOM/NIfTI parsing, parametric maps, automation" },
      { key: "E", title: "Multi-step agentic", desc: "Multi-turn dialogue, tool use, file creation" },
      { key: "F", title: "Connected systems",  desc: "MCP connectors, Claude Code, multi-agent orchestration" },
    ];

    if (isPresenter) {
      renderPresenter();
    } else {
      renderVoter();
    }

    // ====================== VOTER VIEW ======================
    function renderVoter() {
      const VOTE_KEY = `cti_poll_vote_${POLL_NAME}`;
      let currentVote = localStorage.getItem(VOTE_KEY) || null;

      const appEl = document.getElementById('app');
      appEl.innerHTML = `
        <div class="container">
          <div class="voter-header">
            <div class="brand">CTI · Northwestern Radiology</div>
            <h1>AI Workflow Adoption Poll</h1>
            <div class="subtitle">A quick anonymous show-of-hands for today's audience</div>
          </div>

          <div class="question-card">
            <div class="question-text">How are YOU currently using agentic AI in your work?</div>
            <div class="question-hint">Tap your answer. You can change it any time.</div>
          </div>

          <div class="vote-options" id="options"></div>
          <div id="confirm-area"></div>

          <div class="voter-footer">
            Anonymous · no names collected · aggregated results displayed at the front.
          </div>
        </div>`;

      const optionsEl = document.getElementById('options');
      OPTIONS.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-button' + (currentVote === opt.key ? ' selected' : '');
        btn.dataset.key = opt.key;
        btn.innerHTML = `
          <div class="option-letter">${opt.key}</div>
          <div class="option-content">
            <div class="option-title">${opt.title}</div>
            <div class="option-desc">${opt.desc}</div>
          </div>`;
        btn.addEventListener('click', () => castVote(opt.key));
        optionsEl.appendChild(btn);
      });

      updateConfirm();

      async function castVote(newKey) {
        const oldKey = currentVote;
        if (oldKey === newKey) return;

        // Optimistic UI
        currentVote = newKey;
        localStorage.setItem(VOTE_KEY, newKey);
        document.querySelectorAll('.option-button').forEach(b => {
          b.classList.toggle('selected', b.dataset.key === newKey);
        });
        updateConfirm();

        // Atomic vote update — decrement old, increment new
        try {
          if (oldKey) {
            await runTransaction(ref(db, `polls/${POLL_NAME}/totals/${oldKey}`), (c) => Math.max((c || 0) - 1, 0));
          }
          await runTransaction(ref(db, `polls/${POLL_NAME}/totals/${newKey}`), (c) => (c || 0) + 1);
        } catch (e) {
          console.error('Vote error:', e);
          alert('Could not record vote. Check your network and try again.');
        }
      }

      function updateConfirm() {
        const c = document.getElementById('confirm-area');
        if (currentVote) {
          const opt = OPTIONS.find(o => o.key === currentVote);
          c.innerHTML = `
            <div class="vote-confirm">
              ✓ Your vote: <strong>${currentVote} — ${opt.title}</strong>
              <div style="font-size:11px;margin-top:6px;color:rgba(251,174,64,0.7);">
                Tap a different option to change.
              </div>
            </div>`;
        } else {
          c.innerHTML = '';
        }
      }
    }

    // ====================== PRESENTER VIEW ======================
    function renderPresenter() {
      const appEl = document.getElementById('app');
      const voterUrl = window.location.origin + window.location.pathname;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(voterUrl)}&bgcolor=ffffff&color=4E2A84&margin=2`;

      appEl.innerHTML = `
        <div class="presenter-shell">
          <div class="presenter-header">
            <div class="presenter-title">
              <h1>Live Audience Poll · AI Workflow Adoption</h1>
              <div class="sub">CTI · Northwestern Radiology · ${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</div>
            </div>
            <div class="presenter-stats">
              <div class="stat-card">
                <div class="stat-number" id="total-count">0</div>
                <div class="stat-label">Total Votes</div>
              </div>
            </div>
          </div>

          <div class="chart-area" id="chart"></div>

          <button class="reset-button" id="reset-btn">⟳  Reset Poll</button>

          <div class="qr-panel">
            <div class="qr-label">Vote Here</div>
            <img src="${qrUrl}" width="180" height="180" alt="Scan to vote">
            <div class="qr-url">${voterUrl}</div>
          </div>

          <div class="connection-status" id="conn-status">
            <span class="dot"></span> Connecting...
          </div>
        </div>`;

      const chart = document.getElementById('chart');
      OPTIONS.forEach(opt => {
        const row = document.createElement('div');
        row.className = 'bar-row';
        row.innerHTML = `
          <div class="bar-letter">${opt.key}</div>
          <div class="bar-track">
            <div class="bar-fill" id="fill-${opt.key}" style="width:0%"></div>
            <div class="bar-label">${opt.title}</div>
          </div>
          <div class="bar-stats">
            <span class="count" id="count-${opt.key}">0</span>
            <span class="pct" id="pct-${opt.key}">0%</span>
          </div>`;
        chart.appendChild(row);
      });

      onValue(totalsRef, (snapshot) => {
        const totals = snapshot.val() || {};
        let totalVotes = 0;
        OPTIONS.forEach(opt => { totalVotes += (totals[opt.key] || 0); });

        document.getElementById('total-count').textContent = totalVotes;
        document.getElementById('conn-status').className = 'connection-status connected';
        document.getElementById('conn-status').innerHTML = '<span class="dot"></span> Live · synced';

        OPTIONS.forEach(opt => {
          const count = totals[opt.key] || 0;
          const pct = totalVotes > 0 ? (count / totalVotes * 100) : 0;
          document.getElementById(`count-${opt.key}`).textContent = count;
          document.getElementById(`pct-${opt.key}`).textContent = `${pct.toFixed(1)}%`;
          document.getElementById(`fill-${opt.key}`).style.width = `${Math.max(pct, 0.5)}%`;
        });
      }, (error) => {
        console.error('Listener error:', error);
        document.getElementById('conn-status').innerHTML = '<span class="dot"></span> Connection lost';
        document.getElementById('conn-status').className = 'connection-status';
      });

      document.getElementById('reset-btn').addEventListener('click', async () => {
        if (!confirm('Reset all poll results to zero? This cannot be undone.')) return;
        try {
          await remove(ref(db, `polls/${POLL_NAME}`));
          console.log('Poll reset');
        } catch (e) {
          alert('Reset failed: ' + e.message);
        }
      });
    }
  </script>
</body>
</html>
